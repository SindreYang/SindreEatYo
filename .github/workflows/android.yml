name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release variants embed the Metro/Expo JS bundle, so the APK can start
      # on a physical device without a development computer running Metro.
      - run: chmod +x android/gradlew && android/gradlew -p android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SindreEatYo-android-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
